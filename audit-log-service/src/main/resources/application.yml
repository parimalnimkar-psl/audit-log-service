spring:
  application:
    name: audit-log-service
  datasource:
    url: jdbc:h2:mem:audit_log_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSX} %-5level [%thread] %logger{36} - %msg%n"
app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    issuer: "audit-log-service"
    expiration-minutes: 120
  audit:
    genesis-hash: "GENESIS"
    retention-days: 365
