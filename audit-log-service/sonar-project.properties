# SonarQube Project Configuration
sonar.projectKey=audit-log-service
sonar.projectName=Audit Log Service
sonar.projectVersion=1.0.0

# Project description
sonar.projectDescription=Tamper-evident append-only audit service with SHA-256 hash chaining, JWT authentication, JPA/Hibernate, Flyway migrations, OpenAPI documentation, and comprehensive test coverage with JaCoCo.

# Source directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.exclusions=**/config/**,**/dto/**,**/domain/**,**/repository/**

# Java configuration
sonar.language=java
sonar.java.source=17
sonar.java.target=17

# Test coverage configuration
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.jacoco.reportPath=target/jacoco.exec
sonar.jacoco.reportMissing=true

# Code coverage
sonar.coverage.exclusions=**/config/**,**/dto/**,**/domain/**,**/repository/**

# Quality gates
sonar.qualitygate.wait=true
